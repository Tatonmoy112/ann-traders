project_id = "ann-traders-local"
[api]
enabled = true
port = 54321
schemas = ["public", "public_catalog", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password"]
jwt_expiry = 3600
enable_signup = false
[auth.email]
# CLI maps this provider toggle to email/password login. Global auth.enable_signup stays false.
enable_signup = true
enable_confirmations = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.catalog-worker]
# Dedicated high-entropy server secret is checked by the handler, not a user JWT.
verify_jwt = false
[functions.catalog-document]
verify_jwt = false
